name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - icons-next

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: npm ci

      - name: Check source
        run: npm run check

      - name: Test SVG generation
        run: npm test

      - name: Build package
        run: npm run build

      - name: Verify generated sources
        run: git diff --exit-code

      - name: Verify Node ESM imports
        run: |
          node --input-type=module -e "
            await Promise.all([
              import('./dist/index.js'),
              import('./dist/beta/index.js'),
              import('./dist/types.js'),
            ]);
          "

      - name: Verify package contents
        run: npm pack --dry-run
