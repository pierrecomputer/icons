name: Deploy icon previews

on:
  push:
    branches:
      - main
      - icons-next
      - 'icons-beta-*'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build previews
        run: npm run icons:preview

      - name: Assemble site
        run: |
          mkdir -p site/catalog site/families
          cp dist/*.html site/
          cp dist/catalog.html site/catalog/index.html
          cp dist/families.html site/families/index.html
          cp beta/REPORT.md site/report.md
          cp beta/svg/manifest.json site/manifest.json
          touch site/.nojekyll

      - name: Configure Pages
        uses: actions/configure-pages@v6

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to Pages
        id: deployment
        uses: actions/deploy-pages@v5
